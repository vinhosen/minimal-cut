  <!-- Studio Obsidian Rounded Tile -->
  <rect width="512" height="512" rx="116" fill="url(#mc-bg)" />
  <rect x="3" y="3" width="506" height="506" rx="113" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />

